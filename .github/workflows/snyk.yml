name: Snyk Security

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    # nuove CVE su dipendenze già in tree: serve uno scan anche senza commit
    - cron: '0 3 * * 1'

# default deny: nessun permesso implicito sul GITHUB_TOKEN
permissions: {}

jobs:
  snyk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # solo per l'upload SARIF in Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- ADATTARE: toolchain del progetto ---
      - name: Setup runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --ignore-scripts: evita esecuzione di lifecycle script di dipendenze
      # non fidate sul runner. Rimuovere solo se il build lo richiede.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # ----------------------------------------

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      # SCA: dipendenze dirette e transitive
      - name: Snyk Open Source
        continue-on-error: true      # il gating è nello step finale
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --all-projects \
            --severity-threshold=high \
            --sarif-file-output=snyk-oss.sarif

      # SAST sul codice first-party
      - name: Snyk Code (SAST)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk code test \
            --severity-threshold=high \
            --sarif-file-output=snyk-code.sarif

      # Snapshot del progetto in Snyk: solo dal branch di default,
      # altrimenti si popola la dashboard con un progetto per feature branch
      - name: Snyk Monitor
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --all-projects

      # Gating esplicito: fallisce la pipeline se sono stati trovati
      # finding >= high in uno qualsiasi degli scan
      - name: Enforce policy
        if: always()
        run: |
          set -euo pipefail
          found=0
          for f in snyk-*.sarif; do
            [ -e "$f" ] || continue
            n=$(jq '[.runs[].results[]?] | length' "$f")
            echo "$f: $n finding"
            [ "$n" -gt 0 ] && found=1
          done
          exit "$found"
        
      - name: Snyk Open Source (SCA)
        id: oss
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk test --all-projects --severity-threshold=high \
            --sarif-file-output=snyk-oss.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Snyk Code (SAST)
        id: sast
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk code test --severity-threshold=high \
            --sarif-file-output=snyk-code.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Snyk IaC
        id: iac
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk iac test . --severity-threshold=high \
            --sarif-file-output=snyk-iac.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Enforce policy (fail-closed)
        if: always()
        env:
          OSS_EXIT:  ${{ steps.oss.outputs.exit_code }}
          SAST_EXIT: ${{ steps.sast.outputs.exit_code }}
          IAC_EXIT:  ${{ steps.iac.outputs.exit_code }}
        run: |
          set -uo pipefail
          fail=0

          # Semantica exit code Snyk CLI:
          #   0 = nessun issue | 1 = issue trovati
          #   2 = errore CLI/auth/rete  -> BLOCCANTE (scan non attendibile)
          #   3 = nessun progetto supportato -> tollerato solo se dichiarato
          evaluate() {
            local name="$1" code="$2" allow_empty="$3"
            case "$code" in
              0) echo "::notice::${name}: nessun finding >= high" ;;
              1) echo "::error::${name}: finding >= high presenti"; fail=1 ;;
              2) echo "::error::${name}: errore di esecuzione (exit 2) - scan NON valido"; fail=1 ;;
              3)
                if [ "$allow_empty" = "true" ]; then
                  echo "::warning::${name}: nessun target supportato (atteso)"
                else
                  echo "::error::${name}: nessun target supportato - scan NON eseguito"; fail=1
                fi
                ;;
              *) echo "::error::${name}: exit code inatteso ${code}"; fail=1 ;;
            esac
          }

          # ADATTARE: metti "false" appena il repo contiene quel tipo di target.
          evaluate "Snyk OSS"  "$OSS_EXIT"  "false"
          evaluate "Snyk Code" "$SAST_EXIT" "false"
          evaluate "Snyk IaC"  "$IAC_EXIT"  "true"

          exit "$fail"
