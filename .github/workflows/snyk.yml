name: Snyk Security

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions: {}

jobs:
  snyk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rileva quali toolchain/target esistono davvero nel repo.
      # Evita che il setup dell'ambiente faccia fallire il job su repo
      # che non contengono (ancora) quel tipo di progetto.
      - name: Detect project targets
        id: detect
        run: |
          set -euo pipefail
          has_node=false; has_lock=false; has_iac=false
          [ -f package.json ] && has_node=true
          { [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ] || [ -f yarn.lock ]; } && has_lock=true
          # ADATTARE: estendere se usi CloudFormation/ARM/Bicep
          if find . -path ./.git -prune -o \
               \( -name '*.tf' -o -name '*.tfvars' -o -name 'Chart.yaml' \) -print \
               -quit | grep -q .; then has_iac=true; fi
          {
            echo "has_node=$has_node"
            echo "has_lock=$has_lock"
            echo "has_iac=$has_iac"
          } >> "$GITHUB_OUTPUT"
          echo "node=$has_node lock=$has_lock iac=$has_iac"

      - name: Setup Node
        if: steps.detect.outputs.has_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache attiva SOLO con lockfile presente, altrimenti l'action aborta
          cache: ${{ steps.detect.outputs.has_lock == 'true' && 'npm' || '' }}

      # --ignore-scripts: nessun lifecycle script di dipendenze non fidate
      # eseguito sul runner.
      - name: Install dependencies
        if: steps.detect.outputs.has_lock == 'true'
        run: npm ci --ignore-scripts

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      # Verifica che il token sia valido PRIMA degli scan, così un fallimento
      # di auth non viene confuso con "nessuna vulnerabilità".
      - name: Snyk auth check
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -euo pipefail
          snyk --version
          # non stampa il token: solo l'identità associata
          snyk whoami 2>/dev/null || snyk config get api >/dev/null

      - name: Snyk Open Source (SCA)
        id: oss
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk test --all-projects --severity-threshold=high \
            --sarif-file-output=snyk-oss.sarif
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Snyk Code (SAST)
        id: sast
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk code test --severity-threshold=high \
            --sarif-file-output=snyk-code.sarif
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

            # DIAGNOSTICA TEMPORANEA — rimuovere dopo la validazione del controllo.
      # Ri-esegue il SAST senza soglia per capire se i finding esistono
      # ma vengono filtrati, oppure se non esistono affatto.
      - name: SAST diagnostic (no threshold)
        if: always()
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk code test --severity-threshold=low \
            --sarif-file-output=diag-code.sarif
          echo "exit code (threshold=low): $?"
          set -e

          if [ ! -f diag-code.sarif ]; then
            echo "::warning::Nessun SARIF prodotto: Snyk Code non ha analizzato alcun file"
            exit 0
          fi

          echo "--- File analizzati ---"
          jq -r '[.runs[].results[].locations[].physicalLocation.artifactLocation.uri]
                 | unique | .[]' diag-code.sarif

          echo "--- Finding per livello (error=high, warning=medium, note=low) ---"
          jq -r '[.runs[].results[].level] | group_by(.)
                 | map("\(.[0]): \(length)") | .[]' diag-code.sarif

          echo "--- Dettaglio ---"
          jq -r '.runs[].results[]
                 | "\(.level)\t\(.ruleId)\t\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' \
                 diag-code.sarif
      
      - name: Snyk IaC
        id: iac
        if: steps.detect.outputs.has_iac == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk iac test . --severity-threshold=high \
            --sarif-file-output=snyk-iac.sarif
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF
        if: always()
        continue-on-error: true   # assente se nessuno scan ha prodotto output
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .
          category: snyk

      - name: Snyk Monitor
        if: >-
          success() &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.detect.outputs.has_lock == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --all-projects

      - name: Enforce policy (fail-closed)
        if: always()
        env:
          OSS_EXIT:  ${{ steps.oss.outputs.exit_code }}
          SAST_EXIT: ${{ steps.sast.outputs.exit_code }}
          IAC_EXIT:  ${{ steps.iac.outputs.exit_code }}
          IAC_PRESENT: ${{ steps.detect.outputs.has_iac }}
          # ADATTARE: portare a "false" appena il repo contiene quel target.
          ALLOW_EMPTY_OSS: 'true'
          ALLOW_EMPTY_SAST: 'true'
        run: |
          set -uo pipefail
          fail=0

          # Semantica exit code Snyk CLI:
          #   0 = nessun issue >= soglia
          #   1 = issue trovati            -> BLOCCANTE
          #   2 = errore CLI/auth/rete     -> BLOCCANTE (scan non attendibile)
          #   3 = nessun target supportato -> tollerato solo se dichiarato
          #   ""= step skipped o crashato  -> BLOCCANTE
          evaluate() {
            name="$1"; code="$2"; allow_empty="$3"
            case "$code" in
              0) echo "::notice::${name}: nessun finding >= high" ;;
              1) echo "::error::${name}: finding >= high presenti"; fail=1 ;;
              2) echo "::error::${name}: errore di esecuzione (exit 2) - scan NON valido"; fail=1 ;;
              3)
                if [ "$allow_empty" = "true" ]; then
                  echo "::warning::${name}: nessun target supportato (atteso)"
                else
                  echo "::error::${name}: nessun target supportato - scan NON eseguito"; fail=1
                fi ;;
              "") echo "::error::${name}: step non eseguito (skipped/failed a monte) - controllo NON applicato"; fail=1 ;;
              *) echo "::error::${name}: exit code inatteso '${code}'"; fail=1 ;;
            esac
          }

          evaluate "Snyk OSS"  "$OSS_EXIT"  "$ALLOW_EMPTY_OSS"
          evaluate "Snyk Code" "$SAST_EXIT" "$ALLOW_EMPTY_SAST"

          if [ "$IAC_PRESENT" = "true" ]; then
            evaluate "Snyk IaC" "$IAC_EXIT" "false"
          else
            echo "::notice::Snyk IaC: nessun file IaC nel repo, scan non applicabile"
          fi

          exit "$fail"